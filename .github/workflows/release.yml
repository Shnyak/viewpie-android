name: Android Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Determine release version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build installable debug-signed APK
        if: steps.version.outputs.publish == 'true'
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        if: steps.version.outputs.publish == 'true'
        run: cp app/build/outputs/apk/debug/app-debug.apk "Viewpie-Android-${{ steps.version.outputs.version }}.apk"
      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Viewpie Android ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: Viewpie-Android-${{ steps.version.outputs.version }}.apk
